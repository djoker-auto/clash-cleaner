name: Auto Update Clash Subscription

on:
  schedule:
    # Запуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-subscription:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Запуск cleaner.py
        run: |
          python cleaner.py

      - name: Сохранение результатов в GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-update cleaned subscription
          file_pattern: 'clash-filtered.yaml'
